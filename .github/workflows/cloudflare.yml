name: Build and test
# StickCam is plain static files (dist/). It is not published from this repository:
# the rotordeck.com site builds it into /stickcam/ via scripts/integrate-stickcam.py
# and uploads it to R2, so that a single deployment owns the public copy and there
# is one canonical URL. This workflow therefore builds and tests only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
