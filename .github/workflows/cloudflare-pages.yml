name: Deploy to Cloudflare Pages
# Replaces the old GitHub Pages workflow, which could not work: Pages on a private
# repo needs a paid plan. Cloudflare Pages builds `dist/` and serves it from
# stickcam.pages.dev on every push to main (and as a preview on pull requests).
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   – token with "Cloudflare Pages: Edit" for the account
#   CLOUDFLARE_ACCOUNT_ID  – the account tag from the Cloudflare dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=stickcam
            ${{ github.event_name == 'pull_request' && '--branch=preview' || '--branch=main' }}
